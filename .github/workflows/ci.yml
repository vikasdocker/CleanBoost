name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must match global.json, which pins the SDK to 8.0.425 with
      # rollForward latestPatch.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/CleanBoost.App/CleanBoost.App.csproj

      - name: Test (net8.0, cross-platform)
        run: dotnet test tests/CleanBoost.Tests/CleanBoost.Tests.csproj --nologo -v q

      # Opt-in elevation/token checks. They only run against a real Windows host,
      # so this job is the first place they are exercised in CI.
      - name: Test (Windows-only elevation checks)
        run: dotnet test tests/CleanBoost.Tests/CleanBoost.Tests.csproj -c Release -p:RunWindowsTests=true --nologo -v q

      # Warnings are an error. The project is currently warning-free, so this is a
      # real gate rather than a suggestion.
      - name: Build app (Release, win-x64, warnings as errors)
        run: dotnet build src/CleanBoost.App/CleanBoost.App.csproj -c Release -r win-x64 --nologo -v q -warnaserror

  rules:
    name: winapp2.ini is unmodified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rules/winapp2.ini is third-party CC-BY-SA-4.0 and must be redistributed
      # unmodified -- see THIRD-PARTY-NOTICES.md.
      #
      # This compares the *stored blob sha* against a pinned value. The obvious
      # alternative, `git diff HEAD`, is useless: in CI the working tree and HEAD
      # are the same commit, so it can never detect an edit that was already
      # committed. `git hash-object` is also wrong -- it re-applies CRLF filtering
      # and so disagrees with the stored sha on a Windows checkout. `git ls-tree`
      # reports the sha exactly as recorded in the commit.
      #
      # To intentionally refresh winapp2.ini, bump WINAPP2_BLOB to the output of:
      #   git ls-tree HEAD -- rules/winapp2.ini | cut -d' ' -f3
      - name: Verify bundled rules are untouched
        env:
          WINAPP2_BLOB: 53f4376ae3f26cc4e2abd59a778bac1ba8e0e9e7
        run: |
          actual=$(git ls-tree HEAD -- rules/winapp2.ini | awk '{print $3}')
          if [ -z "$actual" ]; then
            echo "::error::rules/winapp2.ini is missing from the repository"
            exit 1
          fi
          if [ "$actual" != "$WINAPP2_BLOB" ]; then
            echo "::error::rules/winapp2.ini was modified ($actual != $WINAPP2_BLOB)."
            echo "::error::It is third-party CC-BY-SA-4.0 material and must be"
            echo "::error::redistributed unmodified. If the upstream database was"
            echo "::error::intentionally refreshed, bump WINAPP2_BLOB in this file."
            exit 1
          fi
          echo "rules/winapp2.ini unmodified ($actual)"